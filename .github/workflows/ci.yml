name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first; there is no value in
# finishing a run for a commit that is already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both are worth running: the gateway resolves config and credential
      # paths differently per platform, and the login flow branches on GOOS.
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Track the toolchain the module declares rather than pinning a
          # version here that can silently drift from go.mod.
          go-version-file: go.mod
          cache: true

      # One target per step rather than a single `make ci`: the targets are
      # the same four checks in the same order, but separate steps keep a
      # formatting failure and a race failure distinguishable in the checks
      # UI. make echoes each command, so the logs still show the go
      # invocation. The rationale for each check lives in the Makefile.
      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Check formatting
        run: make fmt-check

      - name: Test
        run: make race

  build-matrix:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # ccgw is copied between machines as a single binary, so a broken
      # cross-build is a real failure rather than a theoretical one.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/ccgw
